          publish = text.index('if (writeAtomicState(OEM_GEOMETRY_STATE_FILE, text))')
          sig = text.index('lastOemGeometrySignature = signature', publish)
          if not publish < sig:
              raise SystemExit('ERROR: geometry signature is committed before successful state publish')
          print('OEM_OBSERVER_STARTUP_PRIORITY=PASS context_policy_before_hmi=YES')
          print('OEM_OBSERVER_RETRY_CONTRACT=PASS signature_after_publish=YES')
          PY

          unzip -p Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar             com/luka/carplay/cluster/ClusterStateController.class | strings |             grep -Fq 'OEM_GEOMETRY_OBSERVER'

