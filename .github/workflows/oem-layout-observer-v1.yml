              'oem_geometry_observer': 'OEM_LAYOUT_OBSERVER_V1',
              'oem_geometry_state': '/tmp/carplay-oem-geometry.state',
              'oem_geometry_policy': 'OBSERVE_ONLY_NO_CARPLAY_OR_RENDERER_APPLY',
              'oem_geometry_source': 'K1004_LISTMODEL176_ROW1',
              'oem_geometry_build_status': 'COMPILED_OBSERVER_READY',
          }
          for key, value in updates.items():
              pat = r'^' + re.escape(key) + r'=.*$'
              line = key + '=' + value
