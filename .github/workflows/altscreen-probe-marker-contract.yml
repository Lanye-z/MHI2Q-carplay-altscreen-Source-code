name: AltScreen Probe Marker Contract Rebuild

on:
  push:
    branches:
      - experiment/oem-layout-second-screen_v2
      - experiment/oem-layout-second-screen_v3
    paths:
      - 'Toolbox/carplay_alt_screen/src/p1404_resolve.c'
      - 'Toolbox/scripts/altscreen_chain_test.sh'
      - 'Toolbox/scripts/altscreen_chain_test_universal.sh'
      - 'Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh'
      - 'Toolbox/scripts/stop_mmi_cockpit_carplay_test.sh'
      - 'Toolbox/scripts/altscreen_persistent_diag.sh'
      - 'Toolbox/scripts/altscreen_adaptive_diag.sh'
      - 'Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh'
      - 'Toolbox/scripts/status_mmi_cockpit_carplay_test.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_start_autostart_transaction.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_storage_policy.sh'
      - 'VERIFY-NATIVE-DIRECT-RELEASE.sh'
      - 'VERIFY-BRANCH-ZIP-READY.sh'
      - 'Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt'
      - 'BRANCH-ZIP-READY.txt'
      - '.github/workflows/altscreen-probe-marker-contract.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altscreen-probe-marker-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-universal-hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ARM build inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils-arm-linux-gnueabihf python3-pyelftools

      - name: Verify authorization marker source contract
        run: |
          set -euo pipefail
          expected='/mnt/app/root/carplay-altscreen/state/fullchain_probe'
          legacy='/mnt/app/root/hooks/.mibcarplay_fullchain_probe'
          grep -Fq "#define ALTSCREEN_PROBE_MARKER \"$expected\"" Toolbox/carplay_alt_screen/src/p1404_resolve.c
          grep -Fq "PROBE_MARKER=\"\$(p $expected)\"" Toolbox/scripts/altscreen_chain_test_universal.sh
          if grep -Fq "$legacy" Toolbox/carplay_alt_screen/src/p1404_resolve.c; then
            echo "legacy authorization marker still present in source" >&2
            exit 1
          fi
          echo "AUTH_MARKER_SOURCE_CONTRACT=PASS path=$expected"

      - name: Rebuild universal QNX hook
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/altscreen-marker-contract"
          sh Toolbox/carplay_alt_screen/build_source_snapshot.sh universal "$out"
          test -s "$out/libcarplay_altscreen.so"
          expected='/mnt/app/root/carplay-altscreen/state/fullchain_probe'
          legacy='/mnt/app/root/hooks/.mibcarplay_fullchain_probe'
          strings "$out/libcarplay_altscreen.so" | grep -Fq "$expected"
          if strings "$out/libcarplay_altscreen.so" | grep -Fq "$legacy"; then
            echo "legacy authorization marker leaked into rebuilt runtime" >&2
            exit 1
          fi
          strings "$out/libcarplay_altscreen.so" | grep -Fq 'PHASE=RUNTIME_AUTHORIZATION'
          strings "$out/libcarplay_altscreen.so" | grep -Fq 'FORCED_BYPASS'
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libc.so.3'
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libm.so.2'
          echo "AUTH_MARKER_BINARY_CONTRACT=PASS path=$expected"

      - name: Promote rebuilt hook and refresh manifests
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/altscreen-marker-contract"
          dst='Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so'
          cp "$out/libcarplay_altscreen.so" "$dst"

          python3 <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('.')
          hook_rel = 'Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so'
          hmi_rel = 'Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt'
          jar_rel = 'Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar'
          ready_rel = 'BRANCH-ZIP-READY.txt'
          branch_verify_rel = 'VERIFY-BRANCH-ZIP-READY.sh'

          def digest(rel):
              return hashlib.sha256((root / rel).read_bytes()).hexdigest()

          hook_sha = digest(hook_rel)
          jar_sha = digest(jar_rel)

          # Keep HMI release metadata aligned with the runtime actually promoted
          # into the branch. This is what makes GitHub's branch ZIP self-contained.
          hmi = root / hmi_rel
          text = hmi.read_text()
          updates = {
              'universal_runtime_sha256': hook_sha,
              'branch_zip_status': 'READY_FOR_VEHICLE_TEST',
              'branch_zip_policy': 'GITHUB_BRANCH_ZIP_INSTALLABLE',
          }
          for key, value in updates.items():
              pattern = r'^' + re.escape(key) + r'=.*$'
              line = key + '=' + value
              if re.search(pattern, text, flags=re.M):
                  text = re.sub(pattern, line, text, flags=re.M)
              else:
                  if text and not text.endswith('\n'):
                      text += '\n'
                  text += line + '\n'
          hmi.write_text(text)

          # A human-readable, machine-checkable marker for direct branch ZIP use.
          info = {}
          for line in text.splitlines():
              if '=' in line:
                  key, value = line.split('=', 1)
                  info[key] = value
          ready = root / ready_rel
          ready.write_text(
              'BRANCH_ZIP_READY=YES\n'
              'branch=' + os.environ.get('GITHUB_REF_NAME', 'unknown') + '\n'
              'validated_source_commit=' + os.environ.get('GITHUB_SHA', 'unknown') + '\n'
              'mode=' + info.get('mode', 'unknown') + '\n'
              'jar_size=' + info.get('jar_size', 'unknown') + '\n'
              'jar_cksum=' + info.get('jar_cksum', 'unknown') + '\n'
              'jar_sha256=' + jar_sha + '\n'
              'universal_runtime_sha256=' + hook_sha + '\n'
              'display_chain=V2_UNCHANGED\n'
              'install_policy=EXTRACT_BRANCH_ZIP_CONTENTS_TO_SD_ROOT\n'
              'verifier=VERIFY-BRANCH-ZIP-READY.sh\n'
          )

          p = root / 'PACKAGE_SOURCE_MAP.json'
          data = json.loads(p.read_text())
          for rel in list(data):
              path = root / rel
              if path.is_file():
                  data[rel] = digest(rel)
          for rel in [hook_rel, hmi_rel, jar_rel, ready_rel, branch_verify_rel]:
              if (root / rel).is_file():
                  data[rel] = digest(rel)
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          sums = root / 'SHA256SUMS.txt'
          table = {}
          for line in sums.read_text().splitlines():
              parts = line.split(None, 1)
              if len(parts) == 2:
                  rel = parts[1].strip()
                  path = root / rel
                  if path.is_file():
                      table[rel] = digest(rel)
          for rel in [hook_rel, hmi_rel, jar_rel, ready_rel, branch_verify_rel,
                      'PACKAGE_SOURCE_MAP.json']:
              if (root / rel).is_file():
                  table[rel] = digest(rel)
          table.pop('SHA256SUMS.txt', None)
          sums.write_text(
              ''.join(f"{table[rel]} {rel}\n" for rel in sorted(table))
          )
          PY

          sh VERIFY-NATIVE-DIRECT-RELEASE.sh
          sh VERIFY-BRANCH-ZIP-READY.sh

      - name: Commit promoted universal runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so \
            Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt \
            BRANCH-ZIP-READY.txt \
            VERIFY-BRANCH-ZIP-READY.sh \
            PACKAGE_SOURCE_MAP.json \
            SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "build(altscreen): promote authorization-marker fix [skip ci]"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
