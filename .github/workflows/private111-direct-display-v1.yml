name: CarPlay private111 Direct Display V1

on:
  push:
    branches:
      - carplay-private111-direct-display-v1
    paths:
      - '.github/workflows/private111-direct-display-v1.yml'
      - 'Toolbox/carplay_alt_screen/src/**'
      - 'Toolbox/carplay_alt_screen/mirror_display/**'
      - 'Toolbox/carplay_alt_screen/hmi/**'
      - 'Toolbox/scripts/**'
      - 'CARPLAY-PRIVATE111-DIRECT-DISPLAY-V1.md'
      - 'READ-ME-FIRST.md'
      - 'VERIFY-NATIVE-DIRECT-RELEASE.sh'
      - 'VERIFY-MIRROR-RELEASE.sh'
  workflow_dispatch:

concurrency:
  group: private111-direct-display-v1
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-direct111-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: carplay-private111-direct-display-v1
          fetch-depth: 0

      - name: Install ARM inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld g++ binutils-arm-linux-gnueabihf python3-pyelftools libgles2-mesa-dev

      - name: Build universal private111 hook
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/private111-direct-hook"
          sh Toolbox/carplay_alt_screen/build_source_snapshot.sh universal "$out"
          test -s "$out/libcarplay_altscreen.so"

          for marker in             'PHASE=H264_TAP_SHM_READY'             'PHASE=H264_TAP_FIRST_DATA'             'PHASE=H264_TAP_FIRST_SPS'             'PHASE=H264_TAP_FIRST_PPS'             'PHASE=H264_TAP_FIRST_IDR'             'PHASE=H264_AVCC_PROPERTY'             'PHASE=H264_AVCC_CONFIG'             'PHASE=H264_TAP_SHM_RECOVERED'             'PHASE=FRAME_TAP_SHM_RECOVERED'             'PHASE=FRAME_TAP_LAYOUT'             'PHASE=FRAME_TAP_UNSUPPORTED_LAYOUT'             'PHASE=DECODER_FIRST_FRAME backend=stock-omx-tap'             '/carplay111_h264'             '/carplay111_decoded'
          do
            strings "$out/libcarplay_altscreen.so" | grep -Fq "$marker"
          done

          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libc.so.3'
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libm.so.2'
          arm-linux-gnueabihf-readelf --dyn-syms -W "$out/libcarplay_altscreen.so" | grep -Fq '_ScreenStreamSetProperty'

          grep -Fq '#define PROT_READ   0x00000100' Toolbox/carplay_alt_screen/src/qnxshim/sys/mman.h
          grep -Fq '#define PROT_WRITE  0x00000200' Toolbox/carplay_alt_screen/src/qnxshim/sys/mman.h

          UNDEFINED="$(arm-linux-gnueabihf-readelf --dyn-syms -W "$out/libcarplay_altscreen.so" | grep UND | awk '{print $8}' | sort -u)"
          BAD="$(printf '%s\n' "$UNDEFINED" | grep -E '^(__atomic|__sync|__aeabi|__gnu|__tls|__cxa|_Unwind)' || true)"
          test -z "$BAD" || { echo "$BAD" >&2; exit 1; }

          echo "DIRECT111_HOOK_BUILD=PASS"

      - name: Syntax-check direct SHM source and NV12 renderer
        run: |
          set -euo pipefail
          g++ -std=c++98 -Wall -Wextra -Werror -fsyntax-only             -IToolbox/carplay_alt_screen/mirror_display/src             -IToolbox/carplay_alt_screen/src             Toolbox/carplay_alt_screen/mirror_display/src/private111_direct_source.cpp
          g++ -std=c++98 -Wall -Wextra -Werror -fsyntax-only             -IToolbox/carplay_alt_screen/mirror_display/src             Toolbox/carplay_alt_screen/mirror_display/src/gl_renderer.cpp
          echo "DIRECT111_CPP_SYNTAX=PASS"

      - name: Prove private-only fail-open tap placement
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          air = Path('Toolbox/carplay_alt_screen/src/p1404_airplay.c').read_text()
          native = Path('Toolbox/carplay_alt_screen/src/p1404_cockpit_native.c').read_text()
          tap = Path('Toolbox/carplay_alt_screen/src/private111_direct_tap.c').read_text()
          side = Path('Toolbox/carplay_alt_screen/mirror_display/src/main.cpp').read_text()
          make = Path('Toolbox/carplay_alt_screen/mirror_display/Makefile').read_text()

          assert 'const int private_video = alt_state_feed_private_video' in air
          assert 'if (private_video) p111_h264_tap_write' in air
          assert air.index('alt_state_feed_private_video') < air.index('p111_h264_tap_write')
          assert 'p111_h264_tap_note_avcc' in air
          assert '_ScreenStreamSetProperty' in air

          tap_pos = native.index('p111_frame_tap_write(stream, buffer')
          stock_pos = native.index('rc = g_real_render(self, buffer);', tap_pos)
          assert tap_pos < stock_pos
          assert 'Keep the stock call fail-open during V1' in native

          assert 'PROT_READ | PROT_WRITE' in tap
          assert 'PHASE=H264_AVCC_PROPERTY' in tap
          assert 'PHASE=H264_AVCC_CONFIG' in tap
          assert 'PHASE=H264_TAP_SHM_RECOVERED' in tap
          assert 'PHASE=FRAME_TAP_SHM_RECOVERED' in tap
          assert 'PHASE=FRAME_TAP_UNSUPPORTED_LAYOUT' in tap
          assert 'source_layout=%s' in tap
          assert 'qnx_nv12_128x32' in tap
          assert '"tight_fallback"' not in tap

          assert '#include "private111_direct_source.h"' in side
          assert 'carplay_window_source.h' not in side
          assert 'PHASE=DIRECT111_ACTIVE' in side
          assert 'window58_readback=0' in side
          assert 'screen_read_window' not in side

          assert 'private111_direct_source.cpp' in make
          assert 'carplay_window_source.cpp' not in make

          bh = Path('Toolbox/carplay_alt_screen/mirror_display/src/mhi2q_backend.h').read_text()
          bc = Path('Toolbox/carplay_alt_screen/mirror_display/src/mhi2q_backend.cpp').read_text()
          cc = Path('Toolbox/carplay_alt_screen/mirror_display/src/cluster_video_display.cpp').read_text()
          assert 'bool swap();' in bh
          assert 'bool Mhi2qBackend::swap()' in bc
          assert '!backend_.swap()' in cc
          assert 'PHASE=EGL_SWAP_FAILED' in bc
          assert 'PHASE=DECODED_SOURCE_RECOVERED' in side
          assert 'freeze_last_frame=1' in side
          assert 'failures > 150' not in side
          assert 'PHASE=DECODED_SOURCE_LOST' not in side
          print('DIRECT111_SOURCE_CONTRACT=PASS private_only=1 avcc_config=1 stock_forward=1 window58_readback=0 swap_propagation=1 stall_freeze=1')
          PY

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in             Toolbox/carplay_alt_screen/mirror_display/release/start_vehicle.sh             Toolbox/carplay_alt_screen/mirror_display/release/stop_vehicle.sh             Toolbox/scripts/altscreen_chain_test.sh             Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh             Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh             Toolbox/scripts/status_mmi_cockpit_carplay_test.sh \
            Toolbox/scripts/stop_mmi_cockpit_carplay_test.sh \
            VERIFY-NATIVE-DIRECT-RELEASE.sh \
            VERIFY-MIRROR-RELEASE.sh
          do
            sh -n "$f"
          done
          echo "DIRECT111_SHELL_SYNTAX=PASS"

      - name: Enforce first-vehicle integration contract
        run: |
          set -euo pipefail
          ctrl=Toolbox/scripts/altscreen_chain_test_universal.sh
          start=Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh
          launch=Toolbox/carplay_alt_screen/mirror_display/release/start_vehicle.sh
          restore=Toolbox/scripts/stop_mmi_cockpit_carplay_test.sh

          grep -Fq 'echo observe > "$STATE_DIR/IAP2_PROFILE"' "$ctrl"
          grep -Fq 'rm -f "$STATE_DIR/ARMED_IAP2"' "$ctrl"
          grep -Fq 'DISPLAY_PATH=PRIVATE111_DIRECT' "$ctrl"
          grep -Fq 'h264_shm=/carplay111_h264' "$ctrl"
          grep -Fq 'decoded_shm=/carplay111_decoded' "$ctrl"
          if grep -Fq 'DISPLAY_PATH=WINDOW58_READBACK' "$ctrl"; then
            echo "DIRECT111_CONTRACT_FAIL stale Window58 readback runtime label" >&2
            exit 1
          fi

          grep -Fq 'touch /tmp/mmi-mirror-active' "$start"
          grep -Fq '/mnt/app/root/carplay-altscreen/bin/mirror/start_vehicle.sh' "$start"
          grep -Fq 'meaning=destination_first_successful_gles_present' "$start"
          grep -Fq 'LD_PRELOAD= "$BIN"' "$launch"
          grep -Fq 'DIRECT_DISPLAY_SIDECAR=STOPPED' "$restore"

          echo "DIRECT111_FIRST_VEHICLE_CONTRACT=PASS iap2=observe window58_readback=0 java80_only=1"

      - name: Run current vehicle release verifier
        run: |
          set -euo pipefail
          sh VERIFY-NATIVE-DIRECT-RELEASE.sh

      - name: Enforce direct-display sidecar release
        run: |
          set -euo pipefail
          info=Toolbox/carplay_alt_screen/mirror_display/release/BUILD_INFO.txt
          bin=Toolbox/carplay_alt_screen/mirror_display/release/carplay-alt111-mirror-display

          grep -Fq 'release_binary_status=PRIVATE111_DIRECT_DISPLAY_V1' "$info"
          grep -Fq 'vehicle_zip_status=READY_FOR_VEHICLE_TEST' "$info"
          test -s "$bin"
          strings "$bin" | grep -Fq 'carplay-private111-direct-display-v1'
          strings "$bin" | grep -Fq 'PHASE=DISPLAYABLE3_FIRST_PRESENT'
          strings "$bin" | grep -Fq 'PHASE=DIRECT111_ACTIVE'
          if strings "$bin" | grep -Fq 'screen_read_window'; then
            echo "DIRECT111_RELEASE_FAIL stale Window58 readback symbol present" >&2
            exit 1
          fi
          echo "DIRECT111_RELEASE_STATUS=VEHICLE_SIDECAR_READY"

      - name: Promote validated universal hook
        if: github.ref == 'refs/heads/carplay-private111-direct-display-v1'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/private111-direct-hook"
          dst="Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so"
          cp "$out/libcarplay_altscreen.so" "$dst"
          HOOK_SHA="$(sha256sum "$dst" | awk '{print tolower($1)}')"
          export HOOK_SHA

          python3 <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path('.')
          hook_rel = 'Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so'
          hook_sha = os.environ['HOOK_SHA']

          info = root / 'Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt'
          text = info.read_text()
          if re.search(r'^universal_runtime_sha256=.*$', text, flags=re.M):
              text = re.sub(
                  r'^universal_runtime_sha256=.*$',
                  'universal_runtime_sha256=' + hook_sha,
                  text,
                  flags=re.M,
              )
          else:
              text += 'universal_runtime_sha256=' + hook_sha + '\n'
          info.write_text(text)

          additions = [
              hook_rel,
              'CARPLAY-PRIVATE111-DIRECT-DISPLAY-V1.md',
              '.github/workflows/private111-direct-display-v1.yml',
              'Toolbox/carplay_alt_screen/src/private111_direct_shm.h',
              'Toolbox/carplay_alt_screen/src/private111_direct_tap.h',
              'Toolbox/carplay_alt_screen/src/private111_direct_tap.c',
              'Toolbox/carplay_alt_screen/src/p1404_airplay.c',
              'Toolbox/carplay_alt_screen/src/p1404_airplay.h',
              'Toolbox/carplay_alt_screen/src/p1404_cockpit_native.c',
              'Toolbox/carplay_alt_screen/src/aug22_dynamic_reloc.c',
              'Toolbox/carplay_alt_screen/src/libcarplay_altscreen.map',
              'Toolbox/carplay_alt_screen/src/build_qnx_arm.sh',
              'Toolbox/carplay_alt_screen/src/qnxshim/sys/mman.h',
              'Toolbox/carplay_alt_screen/src/qnxshim/errno.h',
              'Toolbox/carplay_alt_screen/mirror_display/src/private111_direct_source.h',
              'Toolbox/carplay_alt_screen/mirror_display/src/private111_direct_source.cpp',
              'Toolbox/carplay_alt_screen/mirror_display/src/main.cpp',
              'Toolbox/carplay_alt_screen/mirror_display/src/gl_renderer.cpp',
              'Toolbox/carplay_alt_screen/mirror_display/src/gl_renderer.h',
              'Toolbox/carplay_alt_screen/mirror_display/src/video_frame.h',
              'Toolbox/carplay_alt_screen/mirror_display/Makefile',
              'Toolbox/carplay_alt_screen/mirror_display/release/BUILD_INFO.txt',
              'Toolbox/carplay_alt_screen/mirror_display/release/start_vehicle.sh',
              'Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt',
              'Toolbox/scripts/status_mmi_cockpit_carplay_test.sh',
          ]

          package = root / 'PACKAGE_SOURCE_MAP.json'
          data = json.loads(package.read_text())
          for rel in list(data):
              p = root / rel
              if p.is_file():
                  data[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          for rel in additions:
              p = root / rel
              if p.is_file():
                  data[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          package.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          sums = root / 'SHA256SUMS.txt'
          table = {}
          for line in sums.read_text().splitlines():
              parts = line.split(None, 1)
              if len(parts) == 2:
                  table[parts[1].strip()] = parts[0].lower()
          for rel in list(table):
              p = root / rel
              if p.is_file():
                  table[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          for rel in additions + ['PACKAGE_SOURCE_MAP.json']:
              p = root / rel
              if p.is_file():
                  table[rel] = hashlib.sha256(p.read_bytes()).hexdigest()
          sums.write_text(''.join('%s %s\n' % (table[k], k) for k in sorted(table)))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "$dst"             Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt             PACKAGE_SOURCE_MAP.json             SHA256SUMS.txt

          if ! git diff --cached --quiet; then
            git commit -m "build(direct111): promote fixed mmap AVCC runtime [skip ci]"
            git fetch origin carplay-private111-direct-display-v1
            git rebase origin/carplay-private111-direct-display-v1
            git push origin HEAD:carplay-private111-direct-display-v1
          fi

          echo "DIRECT111_HOOK_PROMOTED_SHA256=$HOOK_SHA"
