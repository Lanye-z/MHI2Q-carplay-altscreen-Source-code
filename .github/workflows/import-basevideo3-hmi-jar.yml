name: Import BaseVideo3 HMI JAR

on:
  push:
    branches: ['test/carplay-basevideo3-standalone-v1']
    paths:
      - '.github/workflows/import-basevideo3-hmi-jar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import exact vehicle-verified V2.5.1 HMI JAR
        run: |
          set -euo pipefail
          dst='Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar'
          if [ -f "$dst" ]; then
            test "$(wc -c < "$dst")" = 141858
            test "$(sha256sum "$dst" | awk '{print toupper($1)}')" = EAFEBF9FD1A7F4D3962FA5330B6908F45570756ADE24676BAF1F2BF66EDC2C8A
            exit 0
          fi
          URL='https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-56ec-81fb-9fac-5fe3d22b7d85/raw?se=2026-09-18T08%3A30%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=2080a21d-d110-5e8a-a527-9a95750701fb&skoid=d5627e4c-566b-4761-a954-54993b0ed17b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-18T06%3A00%3A07Z&ske=2026-09-19T06%3A00%3A07Z&sks=b&skv=2026-02-06&sig=D/aacHXX61O3amrI4Z9ZzkxAw9zF8qUJMPGkl8G9kLU%3D'
          curl -fsSL "$URL" -o /tmp/carplay-hook-export.zip
          rm -rf /tmp/carplay-hook-export
          mkdir -p /tmp/carplay-hook-export
          unzip -q /tmp/carplay-hook-export.zip -d /tmp/carplay-hook-export
          src='/tmp/carplay-hook-export/carplay_hook-unified.jar'
          test -s "$src"
          test "$(wc -c < "$src")" = 141858
          test "$(sha256sum "$src" | awk '{print toupper($1)}')" = EAFEBF9FD1A7F4D3962FA5330B6908F45570756ADE24676BAF1F2BF66EDC2C8A
          mkdir -p "$(dirname "$dst")"
          cp "$src" "$dst"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dst"
          git commit -m 'build(basevideo3): import standalone Java80 HMI control plane'
          git push origin HEAD:test/carplay-basevideo3-standalone-v1
