name: Finalize Context80 Readback V1

on:
  push:
    branches:
      - test/carplay-basevideo3-context80-readback-v1
    paths:
      - '.github/workflows/context80-readback-finalize.yml'
      - 'Toolbox/carplay_alt_screen/hmi/src/**'
      - 'Toolbox/carplay_alt_screen/hmi/stubs/**'
      - 'Toolbox/carplay_alt_screen/mirror_display/src/carplay_window_source.cpp'
      - 'Toolbox/carplay_alt_screen/mirror_display/src/carplay_window_source.h'
      - 'Toolbox/carplay_alt_screen/mirror_display/src/screen_id_bridge.c'
      - 'Toolbox/carplay_alt_screen/mirror_display/build_screen_id_bridge.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install host build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils-arm-linux-gnueabihf unzip zip

      - name: Build sidecar ID-string compatibility bridge
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/screen-id-bridge"
          sh Toolbox/carplay_alt_screen/mirror_display/build_screen_id_bridge.sh "$out"
          test -s "$out/libscreen_id_bridge.so"
          cp "$out/libscreen_id_bridge.so" Toolbox/carplay_alt_screen/mirror_display/release/libscreen_id_bridge.so
          strings Toolbox/carplay_alt_screen/mirror_display/release/libscreen_id_bridge.so | grep -Fq 'WINDOW58_ID_BRIDGE'
          strings Toolbox/carplay_alt_screen/mirror_display/release/libscreen_id_bridge.so | grep -Fq 'screen_get_window_property_cv'

      - name: Rebuild only ClusterStateController against ABI stub
        run: |
          set -euo pipefail
          JAR=Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar
          SRC=Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/ClusterStateController.java
          STUB=Toolbox/carplay_alt_screen/hmi/stubs/de/audi/atip/base/IFrameworkAccess.java
          BUILD="$RUNNER_TEMP/java80-controller"
          mkdir -p "$BUILD/classes"

          test -s "$JAR"
          unzip -l "$JAR" | grep -Fq 'com/luka/carplay/cluster/ClusterStateController.class'
          if unzip -l "$JAR" | grep -Eq 'META-INF/.*\.(SF|RSA|DSA)$'; then
            echo 'ERROR: refusing to update signed JAR' >&2
            exit 1
          fi

          javap -classpath "$JAR" -public -s com.luka.carplay.cluster.ClusterStateController > "$BUILD/api-old.txt"

          javac -encoding UTF-8 -source 1.3 -target 1.2 -d "$BUILD/classes" "$STUB" "$SRC"

          javap -classpath "$BUILD/classes" -public -s com.luka.carplay.cluster.ClusterStateController > "$BUILD/api-new.txt"

          python3 - "$BUILD/api-old.txt" "$BUILD/api-new.txt" <<'PY'
          import pathlib, sys
          def surface(path):
              lines=pathlib.Path(path).read_text().splitlines()
              out=[]
              i=0
              while i < len(lines):
                  s=lines[i].strip()
                  if s.startswith("public ") and not s.startswith("public final class") and s.endswith(";"):
                      d=""
                      if i+1 < len(lines) and lines[i+1].strip().startswith("descriptor:"):
                          d=lines[i+1].strip()
                          i+=1
                      out.append(s+" | "+d)
                  i+=1
              return set(out)
          old=surface(sys.argv[1]); new=surface(sys.argv[2])
          missing=sorted(old-new)
          if missing:
              raise SystemExit("ERROR: replacement controller drops public ABI:\n" + "\n".join(missing))
          print("JAVA_PUBLIC_ABI_SUBSET=PASS old=%d new=%d" % (len(old), len(new)))
          PY

          cp "$JAR" "$BUILD/carplay_hook-basevideo3.jar"
          jar uf "$BUILD/carplay_hook-basevideo3.jar" -C "$BUILD/classes" com/luka/carplay/cluster/ClusterStateController.class

          python3 - "$BUILD/carplay_hook-basevideo3.jar" <<'PY'
          import collections, struct, sys, zipfile
          p=sys.argv[1]
          target='com/luka/carplay/cluster/ClusterStateController.class'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              dup=[n for n,c in collections.Counter(names).items() if c != 1]
              assert not dup, dup
              b=z.read(target)
              assert b[:4] == b'\xca\xfe\xba\xbe'
              assert struct.unpack('>HH', b[4:8]) == (0,46), struct.unpack('>HH', b[4:8])
              assert b'CTX80_OBSERVED' in b
              assert b'getCurrentContextID' in b
              assert b'ctx80 readback verification failed' in b
          print('JAVA80_CLASSFILE=PASS major=46 ctx80_readback=YES')
          PY

          cp "$BUILD/carplay_hook-basevideo3.jar" "$JAR"
          {
            echo "old_api:"
            cat "$BUILD/api-old.txt"
            echo
            echo "new_api:"
            cat "$BUILD/api-new.txt"
          } > Toolbox/carplay_alt_screen/hmi/API_COMPAT.txt

      - name: Refresh JAR identity, release manifests and package hashes
        run: |
          set -euo pipefail
          JAR=Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar
          SIZE="$(wc -c < "$JAR" | tr -d ' ')"
          CKSUM="$(cksum < "$JAR" | awk '{print $1}')"
          SHA="$(sha256sum "$JAR" | awk '{print tolower($1)}')"
          export SIZE CKSUM SHA

          cat > Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt <<EOF
          mode=CONTEXT80_READBACK_V1
          controller=ClusterStateController
          class_target=Java_1.2_major_46
          context_owner=JAVA_ONLY
          ctx80=98,101,102,3
          context_readback=IDisplayManager.getCurrentContextID(1)
          ctx80_success_marker=CTX80_OBSERVED_actual_80
          jar_size=$SIZE
          jar_cksum=$CKSUM
          jar_sha256=$SHA
          universal_runtime_sha256=07a96cad6121cfc9fae259d47e6c95142b5e09b7ef3e8cd7a180de009579cb39
          universal_runtime_policy=PINNED_KNOWN_GOOD_NOT_REBUILT
          EOF

          python3 <<'PY'
          import hashlib, json, os, pathlib, re
          root=pathlib.Path('.')
          size=os.environ['SIZE']; cksum=os.environ['CKSUM']; sha=os.environ['SHA']

          for rel in [
              'Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh',
              'Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh',
              'Toolbox/scripts/status_mmi_cockpit_carplay_test.sh',
          ]:
              p=root/rel
              text=p.read_text()
              text=re.sub(r'^EXPECTED_SIZE=\d+$', 'EXPECTED_SIZE='+size, text, flags=re.M)
              text=re.sub(r'^EXPECTED_CKSUM=\d+$', 'EXPECTED_CKSUM='+cksum, text, flags=re.M)
              p.write_text(text)

          readme=root/'READ-ME-FIRST.md'
          text=readme.read_text()
          text=re.sub(r'\n## Finalized HMI artifact\n.*?\n(?=## |\Z)', '\n', text, flags=re.S)
          text += (
              '\n## Finalized HMI artifact\n\n'
              'The vehicle JAR is rebuilt only at ClusterStateController.class; all other '
              'entries stay inherited from the pinned BaseVideo3 JAR.\n\n'
              'size    = '+size+'\n'
              'cksum   = '+cksum+'\n'
              'SHA256  = '+sha+'\n'
              'ctx80   = {98,101,102,3}\n'
              'proof   = CTX80_OBSERVED actual=80\n'
          )
          readme.write_text(text)

          relsum=root/'Toolbox/carplay_alt_screen/mirror_display/release/SHA256SUMS'
          lines=relsum.read_text().splitlines()
          helper='libscreen_id_bridge.so'
          h=hashlib.sha256((relsum.parent/helper).read_bytes()).hexdigest()
          found=False; out=[]
          for line in lines:
              parts=line.split(None,1)
              if len(parts)==2 and parts[1].strip()==helper:
                  out.append(h+'  '+helper); found=True
              else:
                  out.append(line)
          if not found: out.append(h+'  '+helper)
          relsum.write_text('\n'.join(out)+'\n')

          package=root/'PACKAGE_SOURCE_MAP.json'
          data=json.loads(package.read_text())
          additions=[
              'Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar',
              'Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt',
              'Toolbox/carplay_alt_screen/hmi/API_COMPAT.txt',
              'Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/ClusterStateController.java',
              'Toolbox/carplay_alt_screen/hmi/stubs/de/audi/atip/base/IFrameworkAccess.java',
              'Toolbox/carplay_alt_screen/mirror_display/src/screen_id_bridge.c',
              'Toolbox/carplay_alt_screen/mirror_display/build_screen_id_bridge.sh',
              'Toolbox/carplay_alt_screen/mirror_display/release/libscreen_id_bridge.so',
              'Toolbox/carplay_alt_screen/mirror_display/release/SHA256SUMS',
          ]
          for rel in list(data):
              p=root/rel
              if p.is_file():
                  data[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          for rel in additions:
              p=root/rel
              data[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          package.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n')

          sums=root/'SHA256SUMS.txt'
          table={}
          for line in sums.read_text().splitlines():
              parts=line.split(None,1)
              if len(parts)==2:
                  table[parts[1].strip()]=parts[0].lower()
          for rel in list(table):
              p=root/rel
              if p.is_file():
                  table[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          additions += [
              'READ-ME-FIRST.md',
              'PACKAGE_SOURCE_MAP.json',
              'Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh',
              'Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh',
              'Toolbox/scripts/status_mmi_cockpit_carplay_test.sh',
          ]
          for rel in additions:
              p=root/rel
              if p.is_file():
                  table[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          sums.write_text(''.join('%s %s\n' % (table[k],k) for k in sorted(table)))
          PY

          echo "HMI_JAR_SIZE=$SIZE"
          echo "HMI_JAR_CKSUM=$CKSUM"
          echo "HMI_JAR_SHA256=$SHA"

      - name: Final static package verification
        run: |
          set -euo pipefail
          sh VERIFY-CONTEXT80-READBACK-V1.sh

      - name: Promote finalized artifacts to experiment branch
        if: github.ref == 'refs/heads/test/carplay-basevideo3-context80-readback-v1'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar             Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt             Toolbox/carplay_alt_screen/hmi/API_COMPAT.txt             Toolbox/carplay_alt_screen/mirror_display/release/libscreen_id_bridge.so             Toolbox/carplay_alt_screen/mirror_display/release/SHA256SUMS             Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh             Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh             Toolbox/scripts/status_mmi_cockpit_carplay_test.sh             READ-ME-FIRST.md PACKAGE_SOURCE_MAP.json SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "build(readback): finalize ctx80 proof artifacts [skip ci]"
            git fetch origin test/carplay-basevideo3-context80-readback-v1
            git rebase origin/test/carplay-basevideo3-context80-readback-v1
            git push origin HEAD:test/carplay-basevideo3-context80-readback-v1
          fi

      - name: Upload final vehicle package
        uses: actions/upload-artifact@v4
        with:
          name: carplay-context80-readback-v1-final
          path: |
            Toolbox/
            READ-ME-FIRST.md
            CONTEXT80-READBACK-V1.md
            VERIFY-CONTEXT80-READBACK-V1.sh
            SHA256SUMS.txt
            PACKAGE_SOURCE_MAP.json
          if-no-files-found: error
