name: AltScreen Universal QNX Build

on:
  push:
    branches: [main]
    paths:
      - 'Toolbox/carplay_alt_screen/src/**'
      - 'Toolbox/carplay_alt_screen/tests/validate_qnx_load_layout.py'
      - 'Toolbox/carplay_alt_screen/build_source_snapshot.sh'
      - 'BUILD-UNIVERSAL-QNX.sh'
      - '.github/workflows/altscreen-universal-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qnx-universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM ELF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-linux-gnueabihf python3-pyelftools
      - name: Build vendored universal hook
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/altscreen-universal"
          sh Toolbox/carplay_alt_screen/build_source_snapshot.sh universal "$out"
          test -s "$out/libcarplay_altscreen.so"
          strings "$out/libcarplay_altscreen.so" | grep -q 'identity_override=DISABLED'
          strings "$out/libcarplay_altscreen.so" | grep -q '/mnt/app/root/carplay-altscreen/lib/libcarplay_altscreen.so'
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libc.so.3'
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libm.so.2'
      - name: Upload universal hook artifact
        uses: actions/upload-artifact@v4
        with:
          name: altscreen-universal-qnx-main
          path: |
            ${{ runner.temp }}/altscreen-universal/libcarplay_altscreen.so
            ${{ runner.temp }}/altscreen-universal/BUILD_INFO.txt
            ${{ runner.temp }}/altscreen-universal/MANIFEST.txt
          if-no-files-found: error
      - name: Promote built runtime to main
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/altscreen-universal"
          dst="Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so"
          cp "$out/libcarplay_altscreen.so" "$dst"
          sha="$(sha256sum "$dst" | awk '{print $1}')"
          python3 - "$sha" <<'PY'
          import json, pathlib, sys
          sha = sys.argv[1]
          rel = "Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so"
          sums = pathlib.Path("SHA256SUMS.txt")
          lines = sums.read_text().splitlines()
          found = 0
          for i, line in enumerate(lines):
              if line.endswith("  " + rel):
                  lines[i] = f"{sha}  {rel}"
                  found += 1
          if found != 1:
              raise SystemExit(f"expected one SHA256SUMS entry, found {found}")
          sums.write_text("\n".join(lines) + "\n")
          path = pathlib.Path("PACKAGE_SOURCE_MAP.json")
          data = json.loads(path.read_text())
          data[rel] = sha
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst" SHA256SUMS.txt PACKAGE_SOURCE_MAP.json
          if ! git diff --cached --quiet; then
            git commit -m "build(altscreen): promote universal QNX runtime [skip ci]"
            git push origin HEAD:main
          fi
