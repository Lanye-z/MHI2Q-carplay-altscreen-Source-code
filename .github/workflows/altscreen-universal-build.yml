name: AltScreen Native Direct QNX Build

on:
  push:
    branches: ['test/native-direct-route-v1']
    paths:
      - 'Toolbox/carplay_alt_screen/src/**'
      - 'Toolbox/carplay_alt_screen/tests/validate_qnx_load_layout.py'
      - 'Toolbox/carplay_alt_screen/build_source_snapshot.sh'
      - 'BUILD-UNIVERSAL-QNX.sh'
      - 'Toolbox/scripts/altscreen_chain_test_universal.sh'
      - 'Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh'
      - 'Toolbox/scripts/status_mmi_cockpit_carplay_test.sh'
      - 'VERIFY-NATIVE-DIRECT-RELEASE.sh'
      - '.github/workflows/altscreen-universal-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qnx-native-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM ELF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-arm-linux-gnueabihf python3-pyelftools

      - name: Build native-direct universal hook
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/altscreen-native-direct"
          sh Toolbox/carplay_alt_screen/build_source_snapshot.sh universal "$out"
          test -s "$out/libcarplay_altscreen.so"
          strings "$out/libcarplay_altscreen.so" | grep -q 'PHASE=NATIVE_111_MANAGED_WINDOW'
          strings "$out/libcarplay_altscreen.so" | grep -q 'PHASE=NATIVE_111_ROUTE_ACTIVATE_RESULT'
          strings "$out/libcarplay_altscreen.so" | grep -q 'PHASE=NATIVE_111_COCKPIT_ACTIVE'
          strings "$out/libcarplay_altscreen.so" | grep -q 'screen_manage_window'
          if strings "$out/libcarplay_altscreen.so" | grep -q 'identity_override=DISABLED'; then
            echo 'helper-isolation runtime leaked into native-direct branch' >&2
            exit 1
          fi
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libc.so.3'
          arm-linux-gnueabihf-readelf -d "$out/libcarplay_altscreen.so" | grep -q 'libm.so.2'

      - name: Upload native-direct artifact
        uses: actions/upload-artifact@v4
        with:
          name: altscreen-native-direct-v1
          path: |
            ${{ runner.temp }}/altscreen-native-direct/libcarplay_altscreen.so
            ${{ runner.temp }}/altscreen-native-direct/BUILD_INFO.txt
            ${{ runner.temp }}/altscreen-native-direct/MANIFEST.txt
          if-no-files-found: error

      - name: Promote native-direct runtime to experiment branch
        if: github.ref == 'refs/heads/test/native-direct-route-v1'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/altscreen-native-direct"
          dst="Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so"
          cp "$out/libcarplay_altscreen.so" "$dst"

          python3 <<'PY'
          import hashlib, json, pathlib

          root = pathlib.Path(".")
          hook_rel = "Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so"
          hook_sha = hashlib.sha256((root / hook_rel).read_bytes()).hexdigest()

          p = root / "PACKAGE_SOURCE_MAP.json"
          data = json.loads(p.read_text())
          for rel in list(data):
              path = root / rel
              if path.is_file():
                  data[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          data[hook_rel] = hook_sha
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")

          sums = root / "SHA256SUMS.txt"
          out_lines = []
          for line in sums.read_text().splitlines():
              parts = line.split(None, 1)
              if len(parts) == 2:
                  rel = parts[1].strip()
                  path = root / rel
                  if path.is_file():
                      line = f"{hashlib.sha256(path.read_bytes()).hexdigest()} {rel}"
              out_lines.append(line)
          sums.write_text("\n".join(out_lines) + "\n")

          relsums = root / "Toolbox/carplay_alt_screen/mirror_display/release/SHA256SUMS"
          lines = relsums.read_text().splitlines()
          found = False
          for i, line in enumerate(lines):
              if line.split()[-1:] == ["libcarplay_altscreen.so"]:
                  lines[i] = f"{hook_sha}  libcarplay_altscreen.so"
                  found = True
          if not found:
              raise SystemExit("release SHA256SUMS has no hook entry")
          relsums.write_text("\n".join(lines) + "\n")
          PY

          sh VERIFY-NATIVE-DIRECT-RELEASE.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst" PACKAGE_SOURCE_MAP.json SHA256SUMS.txt                   Toolbox/carplay_alt_screen/mirror_display/release/SHA256SUMS
          if ! git diff --cached --quiet; then
            git commit -m "build(altscreen): promote native-direct V1 runtime [skip ci]"
            git push origin HEAD:test/native-direct-route-v1
          fi
