              "Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/routeguidance/BAPBridge.java",
              "Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/routeguidance/GatedCombiService.java",
              "Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/framework/CarplayBus.java",
              "Toolbox/carplay_alt_screen/hmi/tests/CarplayBusStickyReplayTest.java",
              "Toolbox/carplay_alt_screen/hmi/tests/RouteGuidanceHardClearTest.java",
              "Toolbox/carplay_alt_screen/hmi/tests/AmapSoftInactiveTest.java",
              "Toolbox/carplay_alt_screen/hmi/tests/BAPGateReinstallTest.java",
              "Toolbox/carplay_alt_screen/src/altscreen_hook.c",
              "Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/ClusterStateController.java",
              "Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/WheelZoomBridge.java",
              "Toolbox/carplay_alt_screen/tests/test_storage_policy.sh",
              "Toolbox/carplay_alt_screen/tests/test_restore_transaction.sh",
              "Toolbox/carplay_alt_screen/tests/test_wheel_zoom_pacing.py",
              "Toolbox/scripts/altscreen_boot_diag.sh",
              "Toolbox/scripts/altscreen_sd_writable.sh",
              "Toolbox/carplay_alt_screen/rgi_meta/libcarplay_rgi_meta.so",
