          wheel_zoom_active_pace_ms=100,150,200
          wheel_zoom_active_threshold_steps=2,6
          wheel_zoom_input_active_ms=300
          wheel_zoom_quiet_small_backlog_max_steps=2
          wheel_zoom_quiet_small_backlog_pace_ms=100
          wheel_zoom_quiet_backlog_pace_ms=150
          wheel_zoom_fallback_pace_ms=250
