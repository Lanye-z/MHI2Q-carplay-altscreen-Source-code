          arrival_time=FCT22_CARPLAY_WHEN_VALID_ELSE_STOCK
          map_scale=FCT45_STOCK_PASSTHROUGH
          remaining_time=NOT_PUBLISHED
          rgi_activation=VISIBLE_OR_ROUTE_ACTIVE_SOURCE_RG_REQUIRED
          rgi_sticky_sync=LOCAL_STICKY_REPLAY_ON_LISTENER_REGISTRATION
          rgi_lifecycle=SYNCHRONIZED_STOP_FRAME_NO_RESURRECT
          lower_bar_teardown=RELEASE_FIELDS_NO_SYNTHETIC_CLEAR_RESTORE_STOCK_LISTENER
          lower_bar_empty_state=INVALID_FIELD_RELEASES_TO_STOCK
          dual_preload_order=ALTSCREEN_RGI_LIBC
          dual_preload_static_audit=PASS_REQUIRED
          dual_preload_child_isolation=ALTSCREEN_AND_RGI_STRIPPED_BEFORE_HELPER_EXEC
          rgi_runtime_scope=PINNED_FULL_RGI_HOOK_METADATA_CONSUMER_ONLY
          amap_soft_inactive_policy=AMAP_OR_UNKNOWN_SIGNATURE_5S_GRACE_WITH_FRESH_GUIDANCE_EXTENSION
          lower_bar_gate_policy=LAZY_PER_FIELD_REVALIDATE_UNWRAP_WHEN_IDLE
