name: V3.3 OEM Lower Bar Build
# Restore hardening closeout is enforced by the transaction regression suite.

on:
  push:
    branches:
      - experiment/oem-layout-second-screen_v3.3
    paths:
      - '.github/workflows/v33-oem-lower-bar-build.yml'
      - 'Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/routeguidance/**'
      - 'Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/framework/CarplayBus.java'
      - 'Toolbox/carplay_alt_screen/hmi/tests/**'
      - 'Toolbox/carplay_alt_screen/src/**'
      - 'Toolbox/carplay_alt_screen/build_source_snapshot.sh'
      - 'Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/ClusterStateController.java'
      - 'Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/WheelZoomBridge.java'
      - 'Toolbox/carplay_alt_screen/hmi/stubs/**'
      - 'Toolbox/carplay_alt_screen/tests/test_storage_policy.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_restore_transaction.sh'
      - 'Toolbox/scripts/altscreen_chain_test.sh'
      - 'Toolbox/scripts/altscreen_sd_writable.sh'
      - 'Toolbox/scripts/altscreen_restore_transaction.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_wheel_zoom_pacing.py'
      - 'Toolbox/scripts/altscreen_boot_diag.sh'
      - 'Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar'
      - 'Toolbox/carplay_alt_screen/rgi_meta/**'
      - 'Toolbox/scripts/altscreen_v33_rgi_config.sh'
      - 'Toolbox/scripts/altscreen_chain_test_universal.sh'
      - 'Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh'
      - 'Toolbox/scripts/start_mmi_cockpit_carplay_rx_test.sh'
      - 'Toolbox/scripts/status_mmi_cockpit_carplay_test.sh'
      - 'VERIFY-BRANCH-ZIP-READY.sh'
      - 'VERIFY-NATIVE-DIRECT-RELEASE.sh'
      - 'BRANCH-ZIP-READY.txt'
      - 'OEM-LAYOUT-SECOND-SCREEN-V3.3.md'
  workflow_dispatch:

concurrency:
  group: v33-oem-lower-bar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install ARM build inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld binutils-arm-linux-gnueabihf python3-pyelftools

      - name: Rebuild child-isolated universal AltScreen runtime
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/v33-universal-runtime"
          sh Toolbox/carplay_alt_screen/build_source_snapshot.sh universal "$OUT"
          test -s "$OUT/libcarplay_altscreen.so"
          strings "$OUT/libcarplay_altscreen.so" | grep -Fq '/mnt/app/root/carplay-altscreen/lib/libcarplay_altscreen.so'
          strings "$OUT/libcarplay_altscreen.so" | grep -Fq '/mnt/app/root/carplay-altscreen/lib/libcarplay_rgi_meta.so'
          cp "$OUT/libcarplay_altscreen.so" Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so
          HOOK_SHA="$(sha256sum Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so | awk '{print tolower($1)}')"
          echo "HOOK_SHA=$HOOK_SHA" >> "$GITHUB_ENV"
          echo "V33_UNIVERSAL_RUNTIME=PASS child_preload=ALTSCREEN_AND_RGI_REMOVED sha256=$HOOK_SHA"

      - name: Verify V3.3 wheel pacing contract
        run: |
          set -euo pipefail
          NATIVE=Toolbox/carplay_alt_screen/src/p1404_cockpit_native.c
          HOOK=Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so
          grep -Fq '#define WHEEL_ZOOM_SCHEDULER_MODEL "OEM_TARGET_FOLLOW_V1"' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_PACING_MODEL "BURST_ADAPTIVE_100_150_200_V2"' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_ACTIVE_SHORT_PACE_US 100000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_ACTIVE_NORMAL_PACE_US 150000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_ACTIVE_LONG_PACE_US 200000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_QUIET_SMALL_BACKLOG_PACE_US 100000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_QUIET_BACKLOG_PACE_US 150000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_INPUT_ACTIVE_US 300000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_FALLBACK_PACE_US 250000u' "$NATIVE"
          grep -Fq '#define WHEEL_ZOOM_SEND_RETRY_US 150000u' "$NATIVE"
          strings "$HOOK" | grep -Fq 'BURST_ADAPTIVE_100_150_200_V2'
          python3 Toolbox/carplay_alt_screen/tests/test_wheel_zoom_pacing.py
          echo 'V33_WHEEL_PACING=PASS scheduler=OEM_TARGET_FOLLOW_V1 pacing=BURST_ADAPTIVE_100_150_200_V2 active=100/150/200 quiet=100/150 fallback=250 first_send=IMMEDIATE decoded_feedback=LIVENESS_ONLY'

      - name: Compile clean V3.3 lower-bar control plane
        run: |
          set -euo pipefail

          BASE=Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar
          SRC=Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/routeguidance
          BUS=Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/framework/CarplayBus.java
          TESTS=Toolbox/carplay_alt_screen/hmi/tests
          CTRL=Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/ClusterStateController.java
          WHEEL=Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/WheelZoomBridge.java
          STUB=Toolbox/carplay_alt_screen/hmi/stubs
          BUILD="$RUNNER_TEMP/v33-oem-lower-bar"

          rm -rf "$BUILD"
          mkdir -p "$BUILD/stubs" "$BUILD/classes" "$BUILD/jar"

          test -s "$BASE"
          unzip -t "$BASE" >/dev/null

          find "$STUB" -name '*.java' -print | sort > "$BUILD/stubs.list"
          javac -encoding UTF-8 -source 1.3 -target 1.2             -d "$BUILD/stubs" @"$BUILD/stubs.list"

          javac -encoding UTF-8 -source 1.3 -target 1.2             -cp "$BUILD/stubs:$BASE"             -d "$BUILD/classes" "$BUS"
          javac -encoding UTF-8 -source 1.3 -target 1.2             -cp "$BUILD/classes:$BUILD/stubs:$BASE"             -sourcepath "$SRC"             -d "$BUILD/classes"             "$SRC/RouteGuidance.java"             "$SRC/AmapRouteGuidance.java"             "$SRC/GatedCombiService.java"             "$SRC/BAPBridge.java"

          # V3.3 inherits the latest V3.2 observability-only wheel classes.
          # Rebuild them in the same authoritative JAR promotion to avoid two
          # independent workflows racing to replace the same HMI artifact.
          javac -encoding UTF-8 -source 1.3 -target 1.2             -cp "$BUILD/stubs:$BASE"             -d "$BUILD/classes"             "$CTRL" "$WHEEL"

          python3 - "$BASE" "$BUILD/classes" "$BUILD/jar/carplay_hook-basevideo3.jar" <<'PY'
          import collections
          import pathlib
          import struct
          import sys
          import zipfile

          src = pathlib.Path(sys.argv[1])
          classes = pathlib.Path(sys.argv[2])
          dst = pathlib.Path(sys.argv[3])

          with zipfile.ZipFile(src, "r") as zin, zipfile.ZipFile(dst, "w", zipfile.ZIP_DEFLATED) as zout:
              for info in zin.infolist():
                  name = info.filename
                  replace_class = (
                      name.startswith("com/luka/carplay/routeguidance/")
                      or name == "com/luka/carplay/framework/CarplayBus.class"
                      or name.startswith("com/luka/carplay/framework/CarplayBus$")
                      or name == "com/luka/carplay/cluster/ClusterStateController.class"
                      or name.startswith("com/luka/carplay/cluster/ClusterStateController$")
                      or name == "com/luka/carplay/cluster/WheelZoomBridge.class"
                      or name.startswith("com/luka/carplay/cluster/WheelZoomBridge$")
                  ) and name.endswith(".class")
                  if replace_class:
                      continue
                  zout.writestr(info, zin.read(name))

              roots = [
                  (classes / "com/luka/carplay/framework",
                   "com/luka/carplay/framework/"),
                  (classes / "com/luka/carplay/routeguidance",
                   "com/luka/carplay/routeguidance/"),
                  (classes / "com/luka/carplay/cluster",
                   "com/luka/carplay/cluster/"),
              ]
              for root, prefix in roots:
                  for path in sorted(root.glob("*.class")):
                      if prefix.endswith("/framework/") and not path.name.startswith("CarplayBus"):
                          continue
                      if prefix.endswith("/cluster/") and not (
                          path.name.startswith("ClusterStateController")
                          or path.name.startswith("WheelZoomBridge")
                      ):
                          continue
                      arc = prefix + path.name
                      info = zipfile.ZipInfo(arc, date_time=(2026, 9, 23, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_DEFLATED
                      info.create_system = 3
                      info.external_attr = 0o100644 << 16
                      zout.writestr(info, path.read_bytes())

          with zipfile.ZipFile(dst, "r") as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit("corrupt JAR member: " + bad)
              names = zf.namelist()
              dup = [n for n, c in collections.Counter(names).items() if c != 1]
              if dup:
                  raise SystemExit("duplicate JAR members: " + repr(dup))

              required = [
                  "com/luka/carplay/framework/CarplayBus.class",
                  "com/luka/carplay/framework/CarplayBus$Data.class",
                  "com/luka/carplay/framework/CarplayBus$Listener.class",
                  "com/luka/carplay/routeguidance/RouteGuidance.class",
                  "com/luka/carplay/routeguidance/RouteGuidance$State.class",
                  "com/luka/carplay/routeguidance/AmapRouteGuidance.class",
                  "com/luka/carplay/routeguidance/GatedCombiService.class",
                  "com/luka/carplay/routeguidance/BAPBridge.class",
                  "com/luka/carplay/routeguidance/BAPBridge$FormattedDistance.class",
                  "com/luka/carplay/routeguidance/BAPBridge$SilentLogChannel.class",
                  "com/luka/carplay/cluster/WheelZoomBridge.class",
                  "com/luka/carplay/cluster/ClusterStateController.class",
              ]
              for name in required:
                  data = zf.read(name)
                  if data[:4] != b"\xca\xfe\xba\xbe":
                      raise SystemExit("bad class magic: " + name)
                  if struct.unpack(">HH", data[4:8]) != (0, 46):
                      raise SystemExit("not Java major 46: " + name)

              retired = [
                  n for n in names
                  if n.startswith("com/luka/carplay/routeguidance/")
                  and (
                      "Renderer" in n
                      or "ManeuverMapper" in n
                      or "SideStreets" in n
                  )
              ]
              if retired:
                  raise SystemExit("retired RGI rendering classes remain: " + repr(retired))

              # Touch and wheel input are deliberately retained.
              for name in [
                  "com/luka/carplay/cursor/CursorController.class",
                  "com/luka/carplay/cluster/WheelZoomBridge.class",
                  "com/luka/carplay/cluster/ClusterStateController.class",
              ]:
                  if name not in names:
                      raise SystemExit("required retained class missing: " + name)

              wheel = zf.read("com/luka/carplay/cluster/WheelZoomBridge.class")
              for marker in [
                  b"WHEEL_CALLBACK_RAW",
                  b"WHEEL_LIFECYCLE",
                  b"callback_count",
                  b"ignored_not_owned",
                  b"action=OBSERVE_ONLY",
              ]:
                  if marker not in wheel:
                      raise SystemExit(
                          "latest V3.2 wheel observability marker missing: "
                          + repr(marker)
                      )

          print("V33_JAR_REBUILD=PASS old_routeguidance_removed=YES sticky_bus=LOCAL_REPLAY touch_retained=YES wheel_observability=V32_LATEST")
          PY

          cp "$BUILD/jar/carplay_hook-basevideo3.jar" "$BASE"

          mkdir -p "$BUILD/test-classes"
          javac -encoding UTF-8 -cp "$BUILD/classes:$BUILD/stubs:$BASE"             -d "$BUILD/test-classes"             "$TESTS/CarplayBusStickyReplayTest.java"             "$TESTS/RouteGuidanceHardClearTest.java"             "$TESTS/AmapSoftInactiveTest.java"             "$TESTS/BAPGateReinstallTest.java"
          java -cp "$BUILD/test-classes:$BUILD/classes:$BUILD/stubs:$BASE"             com.luka.carplay.framework.CarplayBusStickyReplayTest
          java -cp "$BUILD/test-classes:$BUILD/classes:$BUILD/stubs:$BASE"             com.luka.carplay.routeguidance.RouteGuidanceHardClearTest
          java -cp "$BUILD/test-classes:$BUILD/classes:$BUILD/stubs:$BASE"             com.luka.carplay.routeguidance.AmapSoftInactiveTest
          java -cp "$BUILD/test-classes:$BUILD/classes:$BUILD/stubs:$BASE"             com.luka.carplay.routeguidance.BAPGateReinstallTest

      - name: Verify CarPlayHook ABI and OEM lower-bar scope
        run: |
          set -euo pipefail
          JAR=Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar
          SRC=Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/routeguidance
          BUILD="$RUNNER_TEMP/v33-oem-lower-bar"

          javap -classpath "$JAR" -p -s com.luka.carplay.CarPlayHook > "$BUILD/hook.sig"
          javap -classpath "$JAR" -p -s com.luka.carplay.routeguidance.BAPBridge > "$BUILD/bap.sig"
          javap -classpath "$JAR" -p -s com.luka.carplay.routeguidance.GatedCombiService > "$BUILD/gate.sig"
          javap -classpath "$JAR" -p -s com.luka.carplay.routeguidance.RouteGuidance > "$BUILD/rg.sig"
          unzip -Z1 "$JAR" > "$BUILD/jar.list"

          grep -Fq 'com.luka.carplay.routeguidance.RouteGuidance' "$BUILD/hook.sig"
          grep -Fq 'public boolean init(java.lang.Object);' "$BUILD/rg.sig"
          grep -Fq 'public synchronized void start();' "$BUILD/rg.sig"
          grep -Fq 'public synchronized void stop();' "$BUILD/rg.sig"
          grep -Fq 'public boolean isRunning();' "$BUILD/rg.sig"
          grep -Fq 'public void update(com.luka.carplay.routeguidance.RouteGuidance$State);' "$BUILD/bap.sig"

          grep -Fxq 'com/luka/carplay/cursor/CursorController.class' "$BUILD/jar.list"
          grep -Fxq 'com/luka/carplay/cluster/WheelZoomBridge.class' "$BUILD/jar.list"
          grep -Fxq 'com/luka/carplay/cluster/ClusterStateController.class' "$BUILD/jar.list"

          grep -Fq 'updateCurrentPositionInfo' "$SRC/BAPBridge.java"
          grep -Fq 'updateDistanceToDestination' "$SRC/BAPBridge.java"
          grep -Fq 'updateTimeToDestination' "$SRC/BAPBridge.java"
          if grep -Fq 'updateMapScale(' "$SRC/BAPBridge.java"; then
            echo 'ERROR: V3.3 BAPBridge must not synthesize FctID45 MapScale' >&2
            exit 1
          fi
          for retired in updateManeuverDescriptor updateLaneGuidance updateDistanceToNextManeuver updateExitView updateActiveRGType; do
            if grep -Fq "$retired" "$SRC/BAPBridge.java"; then
              echo "ERROR: retired RGI output remains in V3.3 BAPBridge: $retired" >&2
              exit 1
            fi
          done

          grep -Fq 'public void updateMapScale' "$SRC/GatedCombiService.java"
          grep -Fq 'real.updateMapScale' "$SRC/GatedCombiService.java"
          grep -Fq 'public void updateAltitude' "$SRC/GatedCombiService.java"
          grep -Fq 'real.updateAltitude' "$SRC/GatedCombiService.java"
          grep -Fq 'setBlockedFields' "$SRC/GatedCombiService.java"
          grep -Fq 'isFct19Blocked' "$SRC/GatedCombiService.java"
          grep -Fq 'isFct21Blocked' "$SRC/GatedCombiService.java"
          grep -Fq 'isFct22Blocked' "$SRC/GatedCombiService.java"

          grep -Fq 'EVT_RGD_UPDATE' "$SRC/RouteGuidance.java"
          grep -Fq '"dist_dest_m"' "$SRC/RouteGuidance.java"
          grep -Fq '"eta_seconds"' "$SRC/RouteGuidance.java"
          grep -Fq '"current_road"' "$SRC/RouteGuidance.java"
          grep -Fq 'markCachedLowerBarDirty' "$SRC/RouteGuidance.java"
          grep -Fq 'sticky catch-up=LOCAL_LISTENER_REPLAY' "$SRC/RouteGuidance.java"
          grep -Fq 'sticky replay to late listener' Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/framework/CarplayBus.java
          if grep -Fq 'bus.send(CarplayBus.CMD_SYNC_REQ' "$SRC/RouteGuidance.java"; then
            echo 'ERROR: fake CMD_SYNC_REQ returned to V3.3' >&2
            exit 1
          fi
          grep -Fq 'clearLowerBarCache' "$SRC/RouteGuidance.java"
          grep -Fq 'if (v == 0) hardClear = true;' "$SRC/RouteGuidance.java"
          grep -Fq 'amap_soft_inactive_timeout' "$SRC/AmapRouteGuidance.java"
          grep -Fq 'SOFT_INACTIVE_GRACE_MS = 5000L' "$SRC/AmapRouteGuidance.java"
          grep -Fq 'sourceAllowsBehaviorProbe' "$SRC/AmapRouteGuidance.java"
          grep -Fq 'public synchronized void onFrame' "$SRC/RouteGuidance.java"
          grep -Fq 'public synchronized void stop' "$SRC/RouteGuidance.java"
          grep -Fq 'boolean routeLooksActive' "$SRC/RouteGuidance.java"
          grep -Fq 'state.visibleInApp != 0) || routeLooksActive' "$SRC/RouteGuidance.java"
          grep -Fq 'partial_takeover=LAZY_PER_FIELD' "$SRC/BAPBridge.java"
          grep -Fq 'LOWER_BAR_GATE=REINSTALLED reason=cluster_listener_replaced' "$SRC/BAPBridge.java"
          grep -Fq 'LOWER_BAR_GATE=REMOVED' "$SRC/BAPBridge.java"
          grep -Fq 'synthetic_clear=NO' "$SRC/BAPBridge.java"
          grep -Fq 'setBlockedFields(ownFct19, ownFct21, ownFct22)' "$SRC/BAPBridge.java"
          if grep -Fq 'clearLowerBar()' "$SRC/BAPBridge.java" ||
             grep -Fq 'updateCurrentPositionInfo("")' "$SRC/BAPBridge.java" ||
             grep -Fq 'sendDistanceToDestinationRaw(0' "$SRC/BAPBridge.java" ||
             grep -Fq 'updateTimeToDestination(0, 0, -1L)' "$SRC/BAPBridge.java"; then
            echo 'ERROR: V3.3 partial takeover must never synthesize lower-bar clears' >&2
            exit 1
          fi

          grep -Fq 'WHEEL_CALLBACK_RAW' Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/WheelZoomBridge.java
          grep -Fq 'WHEEL_LIFECYCLE' Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/WheelZoomBridge.java
          grep -Fq 'action=OBSERVE_ONLY' Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/WheelZoomBridge.java
          grep -Fq 'WheelZoomBridge.logCarPlayLifecycle(active);' Toolbox/carplay_alt_screen/hmi/src/com/luka/carplay/cluster/ClusterStateController.java
          grep -Fq 'CURSOR_PREFIX="$ROOT/tmp/altscreen_diag_cursor"' Toolbox/scripts/altscreen_boot_diag.sh
          grep -Fq 'flat_file_signature' Toolbox/scripts/altscreen_boot_diag.sh
          grep -Fq 'select_carplay_hook_log_source' Toolbox/scripts/altscreen_boot_diag.sh
          grep -Fq 'streams/carplay_hook.log' Toolbox/scripts/altscreen_boot_diag.sh
          if grep -Fq '.capture-cursors' Toolbox/scripts/altscreen_boot_diag.sh; then
            echo 'ERROR: boot diagnostic cursors must remain volatile' >&2
            exit 1
          fi
          sh -n Toolbox/scripts/altscreen_boot_diag.sh
          sh Toolbox/carplay_alt_screen/tests/test_storage_policy.sh
          sh Toolbox/carplay_alt_screen/tests/test_restore_transaction.sh

          echo 'V33_OEM_LOWER_BAR_ABI=PASS fct=19,21,22 fct45=STOCK touch=RETAINED wheel_observability=V32_LATEST'

      - name: Verify pinned RGI metadata transport
        run: |
          set -euo pipefail
          META=Toolbox/carplay_alt_screen/rgi_meta/libcarplay_rgi_meta.so
          test -s "$META"
          ACTUAL="$(sha256sum "$META" | awk '{print $1}')"
          EXPECTED='87d10f67fbb3dc142642d899977bab0a6eb4009f61d3bcd873d0cce9e01511f7'
          [ "$ACTUAL" = "$EXPECTED" ] || {
            echo "ERROR: V3.3 RGI metadata binary drift: $ACTUAL" >&2
            exit 1
          }
          for id in 0x5200 0x5201 0x5202 0x5203 0x5204; do
            grep -Fq "$id" Toolbox/scripts/altscreen_v33_rgi_config.sh
          done
          echo "V33_RGI_METADATA=PASS sha256=$ACTUAL messages=0x5200-0x5204"

      - name: Audit dual LD_PRELOAD interposer chain
        run: |
          set -euo pipefail
          ALT=Toolbox/carplay_alt_screen/universal/libcarplay_altscreen.so
          META=Toolbox/carplay_alt_screen/rgi_meta/libcarplay_rgi_meta.so
          CHAIN=Toolbox/scripts/altscreen_chain_test_universal.sh

          test -s "$ALT"
          test -s "$META"
          test -s "$CHAIN"

          python3 - "$ALT" "$META" "$CHAIN" <<'PY'
          import pathlib
          import subprocess
          import sys

          alt = pathlib.Path(sys.argv[1])
          meta = pathlib.Path(sys.argv[2])
          chain = pathlib.Path(sys.argv[3])

          def symbols(path):
              out = subprocess.check_output(
                  ["readelf", "-Ws", str(path)],
                  text=True,
                  errors="replace",
              )
              rows = []
              for line in out.splitlines():
                  parts = line.split()
                  if len(parts) < 8 or not parts[0].endswith(":"):
                      continue
                  rows.append((parts[6], parts[7].split("@", 1)[0]))
              return rows

          expected = {
              alt: ("write", "send", "recv", "close"),
              meta: ("read", "write", "writev", "recv", "open", "close",
                     "MsgSend", "MsgSendv"),
          }
          for lib, names in expected.items():
              rows = symbols(lib)
              for sym in names:
                  if not any(ndx != "UND" and name == sym for ndx, name in rows):
                      raise SystemExit(
                          "missing defined interposer %s in %s" % (sym, lib)
                      )
              if not any(ndx == "UND" and name == "dlsym" for ndx, name in rows):
                  raise SystemExit("interposer does not import dlsym: %s" % lib)

          text = chain.read_text()
          rgi = text.find('awk -v hook="$RGI_META_REL"')
          altpos = text.find('awk -v hook="$UNIVERSAL_REL"', rgi + 1)
          marker = "final stable order is AltScreen:RGI:other-stock"
          if rgi < 0 or altpos < 0 or altpos <= rgi or marker not in text:
              raise SystemExit(
                  "preload construction no longer proves AltScreen:RGI ordering"
              )

          print(
              "V33_DUAL_INTERPOSER_CHAIN=PASS "
              "order=AltScreen:RGI:libc "
              "shared=write,recv,close rgi_extra=read,open,writev,MsgSend,MsgSendv forwarding=dlsym"
          )
          PY

          for sym in write recv close; do
            grep -R -Fq "dlsym(RTLD_NEXT, \"$sym\")"               Toolbox/carplay_alt_screen/src || {
                echo "ERROR: AltScreen RTLD_NEXT forwarding missing for $sym" >&2
                exit 1
              }
          done
          HOOKSRC=Toolbox/carplay_alt_screen/src/altscreen_hook.c
          grep -Fq 'ALTSCREEN_RGI_PRELOAD "/mnt/app/root/carplay-altscreen/lib/libcarplay_rgi_meta.so"' "$HOOKSRC"
          grep -Fq 'ALTSCREEN_RGI_PRELOAD_LEGACY "/mnt/app/root/hooks/libcarplay_hook.so"' "$HOOKSRC"
          grep -Fq 'altscreen_strip_project_hooks_from_child_preload();' "$HOOKSRC"

      - name: Update package identities
        run: |
          set -euo pipefail
          JAR=Toolbox/carplay_alt_screen/hmi/carplay_hook-basevideo3.jar
          INFO=Toolbox/carplay_alt_screen/hmi/BUILD_INFO.txt

          SIZE="$(wc -c < "$JAR" | tr -d ' ')"
          CKSUM="$(cksum < "$JAR" | awk '{print $1}')"
          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
