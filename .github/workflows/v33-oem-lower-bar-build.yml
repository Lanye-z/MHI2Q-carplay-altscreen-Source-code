              "wheel_zoom_send_retry_ms": "150",
              "wheel_zoom_frame_feedback":
                  "PROCESS_LOCAL_DECODED_PROGRESS_LIVENESS_ONLY_NOT_CAMERA_COMPLETION",
              "wheel_zoom_telemetry_fallback": "250MS_TIMER",
              "wheel_zoom_response_gate":
                  "NO_ACCEPTANCE_CALLBACK_IS_OBSERVE_ONLY",
              "wheel_zoom_sd_log": "streams/mmi-mirror-wheel-zoom.log",
              "wheel_zoom_sd_event_snapshot":
                  "streams/mmi-mirror-wheel-zoom.events",
              "boot_log_capture":
                  "VOLATILE_BOOT_FLAT_CURSOR_NO_REPLAY",
