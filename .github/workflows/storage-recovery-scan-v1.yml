name: Storage Recovery V1

on:
  push:
    branches:
      - tool/storage-recovery-scan-v1
    paths:
      - 'Toolbox/GEM/mqb-carplayAltScreenStorageRecovery.esd'
      - 'Toolbox/scripts/altscreen_storage_recovery_scan.sh'
      - 'Toolbox/scripts/altscreen_storage_recovery_cleanup.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_storage_recovery_scan.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_storage_recovery_cleanup.sh'
      - 'STORAGE-RECOVERY-SCAN-V1.md'
      - '.github/workflows/storage-recovery-scan-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-read-only-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run read-only storage recovery fixture
        run: |
          set -euo pipefail
          sh Toolbox/carplay_alt_screen/tests/test_storage_recovery_scan.sh

      - name: Verify scanner safety contract
        run: |
          set -euo pipefail
          scan='Toolbox/scripts/altscreen_storage_recovery_scan.sh'
          gem='Toolbox/GEM/mqb-carplayAltScreenStorageRecovery.esd'
          grep -Fq 'READ_ONLY_SCAN=YES' "$scan"
          grep -Fq 'DELETE_PERFORMED=NO' "$scan"
          grep -Fq 'CLASSIFICATION=SCAN_ONLY_NOT_DELETE_AUTHORITY' "$scan"
          grep -Fq 'screen "MMI-Cockpit-Carplay Storage Recovery" Customization' "$gem"
          if grep -Eq '(^|[[:space:]])(rm|mv|cp|mount)[[:space:]]' "$scan"; then
            echo 'destructive or mount command found in read-only scanner' >&2
            exit 1
          fi
          echo 'STORAGE_RECOVERY_READ_ONLY_CONTRACT=PASS'

      - name: Run confirmed cleanup fixture
        run: |
          set -euo pipefail
          sh Toolbox/carplay_alt_screen/tests/test_storage_recovery_cleanup.sh

      - name: Verify cleanup safety contract
        run: |
          set -euo pipefail
          clean='Toolbox/scripts/altscreen_storage_recovery_cleanup.sh'
          gem='Toolbox/GEM/mqb-carplayAltScreenStorageRecovery.esd'
          grep -Fq 'CLEAN CONFIRMED LEGACY FILES' "$gem"
          grep -Fq 'SD_BACKUP_REQUIRED=YES' "$clean"
          grep -Fq 'CHAIN_TEST_OPERATION_LOCK_PRESENT' "$clean"
          grep -Fq 'STARTUP_UNCHANGED=YES' "$clean"
          grep -Fq 'startup.sh.basevideo3.block.*' "$clean"
          grep -Fq 'startup.sh.mirror.block.*' "$clean"
          grep -Fq '/mnt/app/root/hooks/libcp_mirror.so' "$clean"
          grep -Fq '/mnt/app/root/carplay-altscreen/tmp/mirror.previous' "$clean"
          echo 'STORAGE_RECOVERY_CLEANUP_CONTRACT=PASS'
