name: Restore Hardening Audit

on:
  push:
    branches:
      - experiment/oem-layout-second-screen_v3.3
    paths:
      - '.github/workflows/restore-hardening-audit.yml'
      - 'Toolbox/scripts/altscreen_chain_test.sh'
      - 'Toolbox/scripts/altscreen_restore_transaction.sh'
      - 'Toolbox/scripts/altscreen_restore_apply.sh'
      - 'Toolbox/scripts/altscreen_persistent_diag.sh'
      - 'Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh'
      - 'Toolbox/carplay_alt_screen/tests/test_restore_transaction.sh'
      - 'VERIFY-NATIVE-DIRECT-RELEASE.sh'
      - 'VERIFY-BRANCH-ZIP-READY.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run restore hardening audit and persist diagnostics
        shell: bash
        run: |
          set +e
          OUT=RESTORE-HARDENING-AUDIT.txt
          : > "$OUT"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "branch=$GITHUB_REF_NAME"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "== shell syntax =="
          } >> "$OUT"

          syntax_rc=0
          for f in             Toolbox/scripts/altscreen_chain_test.sh             Toolbox/scripts/altscreen_restore_transaction.sh             Toolbox/scripts/altscreen_restore_apply.sh             Toolbox/scripts/altscreen_persistent_diag.sh             Toolbox/scripts/install_mmi_cockpit_carplay_rx.sh             Toolbox/carplay_alt_screen/tests/test_restore_transaction.sh
          do
            echo "-- $f" >> "$OUT"
            sh -n "$f" >> "$OUT" 2>&1
            rc=$?
            echo "rc=$rc" >> "$OUT"
            [ "$rc" -eq 0 ] || syntax_rc=1
          done

          echo >> "$OUT"
          echo "== restore transaction test ==" >> "$OUT"
          sh Toolbox/carplay_alt_screen/tests/test_restore_transaction.sh >> "$OUT" 2>&1
          restore_rc=$?
          echo "restore_test_rc=$restore_rc" >> "$OUT"

          echo >> "$OUT"
          echo "== storage policy test ==" >> "$OUT"
          sh Toolbox/carplay_alt_screen/tests/test_storage_policy.sh >> "$OUT" 2>&1
          storage_rc=$?
          echo "storage_test_rc=$storage_rc" >> "$OUT"

          echo >> "$OUT"
          echo "AUDIT_RESULT syntax_rc=$syntax_rc restore_rc=$restore_rc storage_rc=$storage_rc" >> "$OUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m "ci: persist restore hardening audit [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          exit 0
